# Deployment patch layer for the dedicated remote-enabled profile
# (`remote-exp`), applied after every bundle layer. Mirrors the control-plane
# enablement checklist: a restricted preset table that can never resolve to
# danger-full-access, the remoteEnvironments row pointed at the deployment
# manifest, and the deployment-supplied broker block on the shipped
# remote-tools row. `__BROKER_UID__` is substituted by the container run
# script with `id -u _dsh_ssh`.
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
# The profile patch layer replaces a row's whole config, so the registry keys
# the bundle patch sets must be restated here alongside remoteEnvironments —
# without sharedStorageRoot the authority never owns a medium, the remote
# plane never reaches `ready`, and the tools row correctly stays unmounted.
- id: multi-root-registry
  config:
    sharedStorageRoot: !!js dshHomePath('storages')
    leasePath: !!js dshHomePath('storages/multi_root_workspace.lock')
    maxAdditionalRoots: 16
    backgroundRecovery: true
    remoteEnvironments:
      enabled: true
      manifestPath: /etc/dsh-ssh-broker/manifest.json
# The bundle already ships `multi-root-remote-tools`; a deployment supplies
# its broker block by REPLACING that row's config (patch configs replace
# wholesale), not by inserting a second row. `enabled` is intentionally left
# out: the plane's `remoteEnvironments.enabled: true` above is the initial
# live value, and the persisted switch may still turn the row off.
- id: multi-root-remote-tools
  config:
    broker:
      config:
        socketPath: /run/dsh-ssh-broker/broker.sock
        brokerUid: __BROKER_UID__
        credentialRoot: /var/lib/dsh-ssh-broker
        fullAccessDisabled: true
        confinementProbe:
          verified: true
          evidence: probe-remote-entry-isolation container run
