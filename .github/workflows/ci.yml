name: CI

on:
  # Reusable-verify entry point for release.yml: the tag build must pass the
  # same gates (lint, typecheck, build, probe, tests, smokes, docs) as main.
  workflow_call:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # Do not create a Windows job at all while the paid lane is parked.
        # Repository variables are available while expanding a matrix, unlike
        # `matrix.*` in a job-level condition.
        os: ${{ fromJSON(vars.DSH_WINDOWS_CI == '1' && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      # Readable, non-interactive failures: no TTY to wrap, no spinner rewrites.
      CI: 'true'
      FORCE_COLOR: '0'
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck both faces
        run: pnpm typecheck
      # Build BEFORE the tests: `tests/client-bundle.spec.ts` asserts the BUILT
      # browser artifact, and `lib/` is not in Git (see .gitignore), so a clean
      # checkout has nothing to assert until this step has run.
      - name: Build the package (before the tests that read lib/)
        run: pnpm build

      # Export the verified dialect set BEFORE unit tests decide whether their
      # real-runner cases may skip.
      - if: matrix.os != 'windows-latest'
        name: Probe which kernel dialects this host can really run
        run: pnpm kernel:probe

      # The test log is captured as well as streamed, and uploaded when the step
      # fails. A red run has to be diagnosable from the run page alone — an
      # unreproducible failure with no log is a failure nobody can fix.
      - name: Run the unit suite
        run: pnpm test > vitest.log 2>&1
      - name: Upload the test log when the suite failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-log-${{ matrix.os }}
          path: |
            vitest.log
            *.log
          if-no-files-found: ignore
          retention-days: 7

      - if: matrix.os != 'windows-latest'
        name: Composition gate
        run: pnpm smoke:compose
      - if: matrix.os != 'windows-latest'
        name: Behavior battery
        run: pnpm smoke:behavior > smoke-behavior.log 2>&1
      - name: Upload the behavior smoke log when it failed
        if: failure() && matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-log-${{ matrix.os }}
          path: |
            smoke-behavior.log
            vitest.log
          if-no-files-found: ignore
          retention-days: 7
      - if: matrix.os != 'windows-latest'
        name: Cross-repository journey
        run: pnpm smoke:journey

      - run: pnpm docs:check
