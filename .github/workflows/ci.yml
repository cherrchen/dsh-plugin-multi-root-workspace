name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # macOS exercises the Seatbelt dialect; Linux exercises bwrap/Landlock
        # selection, and both run the confined bash steps of the journey for
        # real. The Windows kernel path is out of scope (the fs fence covers
        # Windows writes; see the requirements document).
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Build BEFORE the tests: `tests/client-bundle.spec.ts` asserts the BUILT
      # browser artifact, and `lib/` is not in Git (see .gitignore), so a clean
      # checkout has nothing to assert until this step has run.
      - run: pnpm build
      - run: pnpm test
      # Decide whether this machine can really confine a process. If it can, the
      # kernel assertions in the matrix and the behavior smoke must EXECUTE
      # (a skip becomes a failure); if it cannot, they skip loudly with a reason
      # instead of pretending to pass. See scripts/check-kernel-runner.mjs.
      - run: pnpm kernel:probe
      - run: pnpm smoke:compose
      - run: pnpm smoke:behavior
      - run: pnpm smoke:journey
      - run: pnpm docs:check
