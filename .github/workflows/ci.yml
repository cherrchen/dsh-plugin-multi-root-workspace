name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        # macOS exercises the Seatbelt dialect; Linux exercises bwrap/Landlock
        # selection, and both run the confined bash steps of the journey for
        # real. The Windows kernel path is out of scope (the fs fence covers
        # Windows writes; see the requirements document).
        os:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke:compose
      - run: pnpm smoke:behavior
      - run: pnpm smoke:journey
      - run: pnpm docs:check
