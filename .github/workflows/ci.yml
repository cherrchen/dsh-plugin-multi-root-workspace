name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  releases:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.contract.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.9.0
          cache: pnpm
      - id: contract
        env:
          DSH_WINDOWS_CI: ${{ vars.DSH_WINDOWS_CI }}
        run: node scripts/ci/plan.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm compat:check
      - run: pnpm lint
      - run: pnpm docs:check

  verify:
    name: verify (${{ matrix.os }}, group ${{ matrix.group }}, Node ${{ matrix.node }})
    needs: releases
    timeout-minutes: 185
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.releases.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      FORCE_COLOR: '0'
      TERM: dumb
      CI_GROUP: ${{ toJSON(matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # 22.04 provides native bwrap evidence; latest retains the Landlock lane.
      # Do not disable AppArmor/user-namespace policy on the latest image.
      - if: runner.os == 'Linux'
        name: Install the bwrap kernel runner
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - if: runner.os == 'Windows'
        name: Install the B9 deny-token broker
        shell: pwsh
        run: ./scripts/windows-broker/install.ps1

      - name: Verify exact releases in isolated checkouts
        run: node scripts/ci/run-group.mjs

      - if: always() && runner.os == 'Windows'
        name: Uninstall the B9 broker and revoke installation rights
        shell: pwsh
        run: ./scripts/windows-broker/install.ps1 -Uninstall

      - name: Upload per-version results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-group-${{ matrix.os }}-${{ matrix.group }}
          path: ${{ runner.temp }}/ci-results
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  # Release checks this job on the same commit's main push run.
  gate:
    needs: [releases, verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.releases.result == 'success' && needs.verify.result == 'success'
        with:
          pattern: ci-group-*
          path: ci-results
      - name: Require exact success for every planned image and version
        env:
          CI_MATRIX: ${{ needs.releases.outputs.matrix }}
          PLAN_RESULT: ${{ needs.releases.result }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: node scripts/ci/gate.mjs ci-results
