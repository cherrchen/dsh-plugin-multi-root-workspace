name: diagnose
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/zz-diagnose.yml']
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kernel: posix
          - os: windows-latest
            kernel: none
    runs-on: ${{ matrix.os }}
    env:
      CI: 'true'
      TERM: dumb
    steps:
      - run: echo probe
      - if: matrix.kernel == 'posix'
        run: echo posix-only
      - name: log
        run: echo x > probe.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.os }}
          path: |
            probe.log
          if-no-files-found: ignore
          retention-days: 1
