name: Release

# Publish an annotated v* tag after the exact commit's main push CI passes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the annotated release tag
        id: tag
        run: |
          # actions/checkout re-points the pushed tag ref at the commit it
          # checked out, so restore the annotated tag object before peeling it.
          git fetch --force --no-tags origin "+${GITHUB_REF}:${GITHUB_REF}"
          tag=$(git rev-parse --verify "${GITHUB_REF}^{tag}")
          commit=$(git rev-parse --verify "${tag}^{commit}")
          test "$commit" = "$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          test "$commit" = "$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
      - name: Wait for the exact main push CI and its gate
        run: node scripts/verify-release-ci.mjs "$TAG_COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.tag.outputs.commit }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Full history so release-notes.mjs can find the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.commit }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.3
          cache: pnpm

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match the package.json version $version"
            exit 1
          fi

      - name: Resolve the npm dist-tag and release channel
        id: publish
        run: node scripts/release-channel.mjs >> "$GITHUB_OUTPUT"

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the package
        run: pnpm build
      - name: Verify the third-party license inventory
        run: pnpm licenses:check

      - name: Pack and verify the tarball contents
        run: |
          pnpm pack --pack-destination dist
          tarball="$(ls dist/*.tgz)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          # Full completeness gate: required members, every exports target,
          # every cordis.patch.yml module, and every relative import the
          # packed lib/*.js entry files follow — including lib/windows-runner.js.
          node scripts/check-pack.mjs

      # npm trusted publishing (OIDC): no static token exists in this repo.
      # The package's Publish settings on npmjs.com list this repository and
      # workflow; `id-token: write` above grants the OIDC claim, and pnpm
      # exchanges it for a short-lived publish credential itself (no
      # registry-url/npmrc auth needed).
      # Prereleases go to their own dist-tag (`0.1.24-beta.1` -> `beta`) so the
      # stable line keeps `latest`; a bug in the derived tag must never fall
      # back to publishing a beta as stable.
      - name: Publish to npm
        env:
          NPM_DIST_TAG: ${{ steps.publish.outputs.tag }}
        run: pnpm publish --no-git-checks --provenance --tag "$NPM_DIST_TAG"

      - name: Generate the release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      # A prerelease is published as a GitHub prerelease and never becomes the
      # repository's "latest release", which stays on the stable line.
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PRERELEASE: ${{ steps.publish.outputs.prerelease }}
        run: |
          args=(--verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md)
          if [ "$RELEASE_PRERELEASE" = "true" ]; then
            args+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" "$TARBALL"
