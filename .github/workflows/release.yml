name: Release

# Publish an annotated v* tag after the exact commit's main push CI passes.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve the annotated release tag
        id: tag
        run: |
          # actions/checkout re-points the pushed tag ref at the commit it
          # checked out, so restore the annotated tag object before peeling it.
          git fetch --force --no-tags origin "+${GITHUB_REF}:${GITHUB_REF}"
          tag=$(git rev-parse --verify "${GITHUB_REF}^{tag}")
          commit=$(git rev-parse --verify "${tag}^{commit}")
          test "$commit" = "$(git rev-parse --verify "${GITHUB_SHA}^{commit}")"
          test "$commit" = "$(git rev-parse HEAD)"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - name: Wait for the exact main push CI and its gate
        run: node scripts/verify-release-ci.mjs "$TAG_COMMIT"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_COMMIT: ${{ steps.tag.outputs.commit }}

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Full history so release-notes.mjs can find the previous tag.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.verify.outputs.commit }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm

      - name: Check that the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME}"
          version="v$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $tag does not match the package.json version $version"
            exit 1
          fi

      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Build the package
        run: pnpm build

      - name: Pack and verify the tarball contents
        run: |
          pnpm pack --pack-destination dist
          tarball="$(ls dist/*.tgz)"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
          # Full completeness gate: required members, every exports target,
          # every cordis.patch.yml module, and every relative import the
          # packed lib/*.js entry files follow — including lib/windows-runner.js.
          node scripts/check-pack.mjs

      # npm trusted publishing (OIDC): no static token exists in this repo.
      # The package's Publish settings on npmjs.com list this repository and
      # workflow; `id-token: write` above grants the OIDC claim, and pnpm
      # exchanges it for a short-lived publish credential itself (no
      # registry-url/npmrc auth needed).
      - name: Publish to npm
        run: pnpm publish --no-git-checks --provenance

      - name: Generate the release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: Create the GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md "$TARBALL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
