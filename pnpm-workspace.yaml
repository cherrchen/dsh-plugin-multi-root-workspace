packages:
  - .

# Native dependency build scripts this repository's toolchain needs to run.
# Keep the list explicit: pnpm blocks unlisted build scripts by default.
allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@deepseek-ai/node-addon-system': true
  '@google/genai': false
  # esbuild reaches the tree through vite (vitest). Its install script only
  # patches the binary path and the platform package is a direct optional
  # dependency, so the script is not needed — declare that instead of letting
  # pnpm fail installs over it.
  esbuild: false
  koffi: true
  node-pty: true
  protobufjs: false

# The pinned runtime is a pre-release published minutes before use; the release
# age gate must not reject it (see docs/decisions/ADR-0002-upstream-coupling-policy.md).
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.2'
  - '@deepseek-ai/dsh@0.1.5-rc.2'
  - '@deepseek-ai/dsh-agent@0.1.5-rc.2'
  - '@deepseek-ai/dsh-app-boot@0.1.5-rc.2'
  - '@deepseek-ai/dsh-base@0.1.5-rc.2'
  - '@deepseek-ai/dsh-bash-local@0.1.5-rc.2'
  - '@deepseek-ai/dsh-bash-sandbox@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-connection@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-locale@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-ui-renderer@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-ui-sidebar@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-ui-slots@0.1.5-rc.2'
  - '@deepseek-ai/dsh-client-ui-workspace@0.1.5-rc.2'
  - '@deepseek-ai/dsh-commands@0.1.5-rc.2'
  - '@deepseek-ai/dsh-fs@0.1.5-rc.2'
  - '@deepseek-ai/dsh-fs-local@0.1.5-rc.2'
  - '@deepseek-ai/dsh-fs-sandbox@0.1.5-rc.2'
  - '@deepseek-ai/dsh-sandbox@0.1.5-rc.2'
  - '@deepseek-ai/dsh-sandbox-local@0.1.5-rc.2'
  - '@deepseek-ai/dsh-sandbox-policy@0.1.5-rc.2'
  - '@deepseek-ai/dsh-sandbox-windows-acl@0.1.5-rc.2'
  - '@deepseek-ai/dsh-session@0.1.5-rc.2'
